# Render Blueprint — https://render.com/docs/blueprint-spec
# Syncs build/start for this FastAPI app (not Django/gunicorn.wsgi).

services:
  - type: web
    name: wryte-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
